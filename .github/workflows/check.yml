name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      - run: npm run typecheck
      - run: npm run build
      - run: npm run demo:check
      # Informational: src changes in parallel streams must not wait for a deck rebuild; re-export before submission (D-017).
      - name: Presentation scenes match src (re-export before submission)
        continue-on-error: true
        run: npm run demo:export:check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/presentation/requirements.txt
      - run: pip install -r docs/presentation/requirements.txt
      - run: python scripts/build-presentation.py --check
      - run: test -z "$(bash .claude/hooks/check-secrets.sh)"
      - run: docker compose build
      - run: git diff --exit-code
