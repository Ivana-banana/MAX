name: monitor
# External liveness check of the deployed bot (D-032; primary alerting is UptimeRobot, D-049): the bot must answer for the whole
# review period, and MAX drops the webhook subscription after 8 hours without delivery.
# A failed scheduled run emails whoever last changed this cron line.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor
  cancel-in-progress: false
env:
  BASE_URL: https://81-26-178-75.sslip.io
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            certs
            scripts
      # /health answers ok with no failed deliveries; with the secret, the webhook subscription exists.
      - name: Bot is alive
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: bash scripts/monitor.sh
